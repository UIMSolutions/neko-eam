helpPage_overview_title=Übersicht
helpPage_overview=<p>Die Startseite fasst das Architektur-Repository zusammen: Kennzahlen des Anwendungsportfolios (Anwendungen in Betrieb, jährliche Kosten, Technologierisiken, Fähigkeitslücken, TIME-Abweichungen, Produkthinweise) und die Anzahl der Elemente je Bereich.</p><ul><li>Wählen Sie eine Kennzahl, um die zugehörige Analyse zu öffnen.</li><li>Wählen Sie einen Bereich, um seine Liste zu öffnen.</li><li><strong>Exportieren</strong> lädt das gesamte Repository als Excel-Arbeitsmappe herunter; <strong>Importieren</strong> lädt eine solche Arbeitsmappe wieder hoch (mit vorheriger Prüfung).</li></ul>
helpPage_list_title=Arbeiten mit der Liste
helpPage_list=<ul><li><strong>Suche</strong> filtert die Liste beim Tippen nach dem Namen.</li><li>Wählen Sie eine Zeile, um das Element (Objektseite) zu öffnen.</li><li><strong>Anlegen</strong> erstellt ein neues Element.</li><li><strong>Exportieren</strong> lädt die Liste als CSV (Komma oder Semikolon) oder als Excel-Arbeitsmappe herunter.</li><li><strong>Importieren</strong> lädt eine CSV- oder Excel-Datei hoch: Zeilen werden über die ID zugeordnet, vorhandene Elemente aktualisiert, neue angelegt. <strong>Prüfen</strong> validiert die Datei, ohne zu speichern.</li></ul><p>Schaltflächen, für die Ihnen die Berechtigung fehlt, werden nicht angezeigt.</p>
helpPage_detail_title=Arbeiten mit der Objektseite
helpPage_detail=<ul><li><strong>Bearbeiten</strong> schaltet die Felder in den Eingabemodus; <strong>Sichern</strong> prüft und speichert die Änderungen, <strong>Abbrechen</strong> verwirft sie.</li><li>Mit * markierte Felder sind Pflichtfelder. Berechnete Felder (z. B. Hierarchiepfade, Summen, Bewertungen) füllt das System.</li><li>Verweise sind Links: Wählen Sie sie, um das verknüpfte Element zu öffnen.</li><li><strong>Verwendungsnachweis</strong> zeigt die Elemente, die auf dieses verweisen – ein noch verwendetes Element kann nicht gelöscht werden.</li><li><strong>Kommentare</strong> führen ein Journal des Elements mit Datum und Autor. Ersteller, letzter Bearbeiter und andere Kommentierende werden benachrichtigt.</li><li>Fahren Sie mit der Maus über eine Feldbezeichnung, um ihre Bedeutung zu sehen.</li></ul>
helpPage_analysis_title=Analysen
helpPage_analysis=<ul><li><strong>TIME-Bewertung</strong>: Anwendungen nach Geschäftswert und technischer Eignung, mit empfohlener Kategorie (Tolerate, Invest, Migrate, Eliminate) und Abweichungen von der erfassten.</li><li><strong>Technologierisiken</strong>: Anwendungen, die IT-Komponenten ohne Support nutzen.</li><li><strong>Produkt-Lebenszyklushinweise</strong>: Support-Ende, Ende der Sicherheitsupdates, Lebensende, abgelaufene BSI-Freigaben, gesperrte Produkte im Einsatz.</li><li><strong>Fähigkeitsabdeckung</strong>: Fähigkeiten ohne (Lücke) oder mit mehreren (Redundanz) unterstützenden Anwendungen.</li></ul>
helpPage_backups_title=Sicherung und Wiederherstellung
helpPage_backups=<p>Eine Sicherung enthält alle Daten des Mandanten, auch Benutzer, Rollen, Berechtigungen, Kommentare und Benachrichtigungen. Vor einer Wiederherstellung wird die Sicherung geprüft (Prüfsumme, Format, Probeladen) und zuerst eine Sicherheitskopie des aktuellen Stands angelegt.</p><ul><li><strong>Anlegen</strong> erstellt eine manuelle Sicherung; geplante Sicherungen laufen automatisch, nur die neuesten bleiben erhalten.</li><li>Laden Sie eine Sicherung herunter, um sie außerhalb des Servers aufzubewahren; laden Sie eine hoch, um sie wiederherzustellen.</li></ul><p>Sicherung und Wiederherstellung erfordern Administratorrechte im Mandanten.</p>
helpPage_tenants_title=Mandanten
helpPage_tenants=<p>Jeder Mandant hat ein eigenes Repository, eigene Benutzer, Rollen und Sicherungen. Systemadministratoren legen Mandanten hier an, sperren und löschen sie. Ein Mandant kann einer Identitätszone (Subaccount) zugeordnet werden: Benutzer dieser Zone arbeiten immer in ihm.</p><p>Vor dem Löschen eines Mandanten wird eine letzte Sicherung angelegt.</p>
helpPage_search_title=Suchergebnisse
helpPage_search=<p>Die zentrale Suche durchsucht Namen, Beschreibungen und weitere Textfelder aller Bereiche, die Sie lesen dürfen. Die besten Treffer stehen oben; wählen Sie einen, um ihn zu öffnen.</p>
helpPage_report_title=Berichtsergebnis
helpPage_report=<p>Ein Bericht führt eine gespeicherte Definition (Entitätsmenge, Spalten, Filter, Sortierung, Gruppierung) mit Ihren Berechtigungen aus. Exportieren Sie das Ergebnis als CSV, Excel oder PDF. Eine Berichtsmappe führt alle ihre Berichte nacheinander aus.</p>

helpTopicGettingStarted_title=Erste Schritte
helpTopicGettingStarted=<ol><li>Wählen Sie in der Seitennavigation einen Bereich (z. B. Anwendungen).</li><li>Öffnen Sie ein Element aus der Liste oder legen Sie ein neues an.</li><li>Verknüpfen Sie Elemente über ihre Verweisfelder – Analysen und Summen bauen auf diesen Verknüpfungen auf.</li><li>Prüfen Sie die Seiten <strong>Übersicht</strong> und <strong>Analysen</strong> auf Befunde.</li></ol>
helpTopicNavigation_title=Navigation
helpTopicNavigation=<ul><li>Die Seitennavigation gruppiert die Bereiche; die Menü-Schaltfläche blendet sie ein oder aus.</li><li>Das Logo führt zur Übersicht zurück.</li><li>Das Benutzermenü (Ihre Initialen) wechselt Sprache, Design und Mandant, ändert Ihr Kennwort und meldet Sie ab.</li></ul>
helpTopicSearch_title=Suche
helpTopicSearch=<p>Geben Sie mindestens zwei Zeichen in das Suchfeld der Shell-Leiste ein: Die besten Treffer aller Bereiche werden vorgeschlagen. Die Eingabetaste zeigt alle Ergebnisse.</p>
helpTopicNotifications_title=Benachrichtigungen
helpTopicNotifications=<p>Die Glocke zeigt die Anzahl der ungelesenen Benachrichtigungen.</p><ul><li><strong>Hinweise</strong> sind fällige oder überfällige Einträge der Bereiche, die Sie lesen dürfen: Lebenszyklusdaten von Produkten, Reviews von Dokumenten und Schutzbedarfsfeststellungen, verzögerte Arbeitspakete, überfällige Sicherheitsmaßnahmen und Risikobehandlungen, verfehlte KPIs.</li><li><strong>Aktivitäten</strong> zeigen Änderungen, Löschungen und Kommentare anderer Benutzer an Elementen, die Sie angelegt, zuletzt bearbeitet oder kommentiert haben.</li></ul><p>Wählen Sie eine Benachrichtigung, um das Element zu öffnen (sie gilt dann als gelesen); die Schließen-Schaltfläche entfernt sie aus Ihrer Liste.</p>
helpTopicRights_title=Berechtigungen
helpTopicRights=<p>Was Sie lesen, anlegen, ändern und löschen dürfen, legen die Rollen Ihres Benutzers fest (Zugriffsverwaltung). Bereiche ohne Leserecht sind ausgeblendet; Aktionen ohne Berechtigung werden nicht angeboten. Wenden Sie sich an einen Administrator, wenn Sie mehr Rechte benötigen.</p>
helpTopicKeyboard_title=Tastatur
helpTopicKeyboard=<ul><li><strong>F1</strong> öffnet oder schließt diese Hilfe.</li><li><strong>Tab</strong> / <strong>Umschalt+Tab</strong> wechseln zwischen Feldern und Schaltflächen; <strong>Eingabe</strong> oder <strong>Leertaste</strong> lösen sie aus.</li><li>In Listen bewegen die Pfeiltasten zwischen den Zeilen, <strong>Eingabe</strong> öffnet das Element.</li></ul>

helpSet_Applications=<p>Anwendungen sind die IT-Systeme des Portfolios. Sie werden nach Geschäftswert und technischer Eignung bewertet (TIME-Kategorie), haben Lebenszyklus, Kritikalität und Kosten und sind mit Fähigkeiten, IT-Komponenten, Produkten und ihrer verantwortlichen Organisationseinheit verknüpft.</p>
helpSet_ApplicationGroups=<p>Anwendungsgruppen gliedern das Anwendungsportfolio als Baum. Die Produktsummen werden aus den Anwendungen des Teilbaums berechnet.</p>
helpSet_Products=<p>Produkte sind Softwareprodukt-Versionen des Produktkatalogs mit Lebenszyklusdaten (Support-Ende, Ende der Sicherheitsupdates, Lebensende), Lizenz-, Freigabe-, Sicherheits- und Compliance-Merkmalen. Die Lebenszyklusdaten erzeugen die Produkthinweise.</p>
helpSet_ProductGroups=<p>Produktgruppen gliedern den Produktkatalog als Baum.</p>
helpSet_ITComponents=<p>IT-Komponenten sind technische Bausteine (Plattformen, Middleware, Datenbanken, Infrastruktur) mit Hersteller, Release und Support-Ende. Anwendungen, die Komponenten ohne Support nutzen, erscheinen als Technologierisiken.</p>
helpSet_BusinessCapabilities=<p>Geschäftsfähigkeiten beschreiben, was das Unternehmen tut, als Fähigkeitslandkarte (Baum). Anwendungen unterstützen Fähigkeiten; Fähigkeiten ohne oder mit mehreren unterstützenden Anwendungen erscheinen als Lücken bzw. Redundanzen.</p>
helpSet_BusinessProcesses=<p>Geschäftsprozesse beschreiben, wie das Unternehmen arbeitet, als Prozesslandkarte (Baum) mit Prozesseigner und Prozessmanager.</p>
helpSet_BusinessData=<p>Geschäftsdaten sind die Geschäftsobjekte mit Eigentümer, Version und dem Ergebnis der Datenschutz-Folgenabschätzung (DSFA), verknüpft mit Fähigkeiten und Informationsflüssen.</p>
helpSet_Organizations=<p>Organisationseinheiten bilden das Organigramm. Leitung, Mitglieder und Kapazität werden aus den aktuellen Mitgliedern berechnet.</p>
helpSet_Enterprises=<p>Organisationen sind Rechtseinheiten (Konzernstruktur) mit Rechtsform, Register- und Steuerdaten. Einheiten, Mitglieder und Geschäftsführung werden aus den Organisationseinheiten berechnet.</p>
helpSet_Members=<p>Mitglieder sind die Personen der Organisationseinheiten mit Funktion (Leitung, Stellvertretung, Mitarbeiter, Assistenz), Beschäftigungsart, Kapazität und optional ihrem Benutzerkonto. Eine Einheit hat höchstens eine aktuelle Leitung; Personalnummern sind eindeutig.</p>
helpSet_ServiceProductGroups=<p>Serviceproduktgruppen bilden den Servicekatalog (Baum) mit Katalogtyp, Version und Katalogverantwortlichem.</p>
helpSet_StrategicGuidelines=<p>Strategische Leitlinien geben die Richtung der IT-Bebauungsplanung vor (Geschäft, Architektur, Technologie, Daten, Sicherheit, Sourcing, Compliance) und gelten für Fähigkeiten.</p>
helpSet_ServiceCapabilities=<p>Servicefähigkeiten beschreiben, was die IT leistet, mit aktuellem und angestrebtem Reifegrad (1–5); die Reifegradlücke wird berechnet.</p>
helpSet_MeasureGroups=<p>Maßnahmengruppen bündeln Maßnahmen der Bebauungsplanung; Anzahl und geschätzte Kosten der Maßnahmen werden aus dem Teilbaum berechnet.</p>
helpSet_Measures=<p>Maßnahmen sind die geplanten Veränderungen der Bebauung (einführen, modernisieren, migrieren, konsolidieren, ablösen, optimieren, investieren) mit Status, Fortschritt und Kosten. Sie setzen Leitlinien um, verbessern Servicefähigkeiten und verändern Anwendungen und Komponenten.</p>
helpSet_ArchitecturePrinciples=<p>Architekturprinzipien sind die grundlegenden Regeln der Architektur mit Aussage, Begründung und Auswirkungen, abgeleitet aus strategischen Leitlinien.</p>
helpSet_ArchitectureGuidelines=<p>Architekturrichtlinien konkretisieren Prinzipien (verpflichtend, empfohlen, optional), benennen Standardprodukte und gelten für IT-Komponenten.</p>
helpSet_ReferenceArchitectures=<p>Referenzarchitekturen beschreiben bewährte Ziellösungen: befolgte Prinzipien und Richtlinien, Bausteine, Standardprodukte und Anwendungen, die sie umsetzen.</p>
helpSet_ArchitectureDocuments=<p>Architekturdokumente (Konzepte, Spezifikationen, Standards, Entscheidungen, Richtlinien, …) mit Freigabe- und Reviewdaten. Dokumente, deren nächstes Reviewdatum überschritten ist, werden markiert und gemeldet.</p>
helpSet_Projects=<p>Projekte setzen die Transformation um. Teilprojekte, Arbeitspakete, geplanter Aufwand und Fortschritt werden aufsummiert.</p>
helpSet_SubProjects=<p>Teilprojekte gliedern ein Projekt; Arbeitspakete, geplanter Aufwand und Fortschritt werden aufsummiert, einschließlich untergeordneter Teilprojekte.</p>
helpSet_WorkPackages=<p>Arbeitspakete sind die planbaren Einheiten eines Projekts mit Terminen, Aufwand, Kosten und Fortschritt. Ein Arbeitspaket, das zum Enddatum nicht abgeschlossen ist, wird als verzögert markiert und gemeldet.</p>
helpSet_InformationFlows=<p>Informationsflüsse verbinden eine Quell- und eine Zielanwendung (API, Datei, Nachricht, Datenbank, manuell) mit Datenobjekt und Häufigkeit. Sie fließen in die Auswirkungsanalyse ein.</p>
helpSet_Users=<p>Benutzer dürfen sich anmelden und in diesem Mandanten arbeiten. Ihre Rechte ergeben sich aus ihren Rollen; die wirksamen Rechte zeigt die Objektseite. Bei der lokalen Anmeldung setzen Administratoren hier die Kennwörter.</p>
helpSet_Roles=<p>Rollen bündeln Berechtigungen. Nur aktive Rollen gewähren Rechte.</p>
helpSet_Permissions=<p>Eine Berechtigung gewährt Lesen, Anlegen, Ändern und Löschen für eine Entitätsmenge oder für alle (All). Benutzer, Rollen und Berechtigungen selbst werden nur durch ausdrückliche Berechtigungen erfasst.</p>
helpSet_ITProcesses=<p>IT-Prozesse (z. B. ITIL oder COBIT) mit Zweck, Verantwortlichen, Reifegrad, Schritten und KPIs; der KPI-Status zeigt den schlechtesten KPI.</p>
helpSet_ProcessSteps=<p>Prozessschritte beschreiben den Ablauf eines IT-Prozesses (Aktivität, Entscheidung, Freigabe, automatisiert, Übergabe) mit Ausführendem, Dauer und unterstützenden Anwendungen.</p>
helpSet_ProcessKpis=<p>KPIs messen einen IT-Prozess an Ziel- und Schwellenwert; Status und Zielerreichung werden berechnet. Verfehlte KPIs werden gemeldet.</p>
helpSet_ProtectionRequirements=<p>Schutzbedarfsfeststellungen (BSI 200-2) bewerten Vertraulichkeit, Integrität und Verfügbarkeit einer Anwendung, eines Geschäftsobjekts oder einer IT-Komponente; das Gesamtniveau folgt dem Maximumprinzip. Überfällige Reviews werden gemeldet.</p>
helpSet_SecurityRisks=<p>Sicherheitsrisiken (ISO 27005) mit Bedrohung, Schwachstelle, Eintrittswahrscheinlichkeit und Auswirkung; Bewertung und Stufe werden berechnet, auch nach der Behandlung (Restrisiko). Offene Risiken nach ihrem Fälligkeitsdatum werden gemeldet.</p>
helpSet_SecurityControls=<p>Sicherheitsmaßnahmen (ISO 27001, BSI IT-Grundschutz, …) mit Umsetzungsstatus und Wirksamkeit; Maßnahmen, die zum Fälligkeitsdatum nicht umgesetzt sind, werden gemeldet.</p>
helpSet_Reports=<p>Berichte sind gespeicherte Abfragen: Entitätsmenge, Spalten, Filter, Sortierung, Gruppierung und Summe. Führen Sie sie auf der Objektseite aus und exportieren Sie das Ergebnis.</p>
helpSet_ReportBooks=<p>Berichtsmappen führen mehrere Berichte in fester Reihenfolge für eine Zielgruppe aus.</p>

helpField_timeCategory=Gartner TIME: Tolerate, Invest, Migrate oder Eliminate – die Analyse empfiehlt eine Kategorie aus Geschäftswert und technischer Eignung.
helpField_businessValue=Beitrag zum Geschäft, von 1 (gering) bis 5 (hoch).
helpField_technicalFit=Technische Qualität und Passung zur Zielarchitektur, von 1 (schlecht) bis 5 (sehr gut).
helpField_criticality=Wie kritisch die Anwendung für den Geschäftsbetrieb ist.
helpField_missionCriticality=Wie kritisch das Element für den Auftrag des Unternehmens ist.
helpField_levelId=Position in der Hierarchie (z. B. 1, 1.2, 1.2.3).
helpField_hierarchyPath=Pfad vom obersten Element des Baums bis zu diesem Element.
helpField_objectState=Pflegezustand des Eintrags (Entwurf, aktiv, inaktiv, archiviert) – unabhängig vom Lebenszyklus.
helpField_annualCost=Gesamtkosten pro Jahr (TCO).
helpField_totalUsedProducts=Anzahl der genutzten Produkte, einschließlich der untergeordneten Elemente.
helpField_totalAssignedProducts=Anzahl der zugewiesenen Produkte, einschließlich der untergeordneten Elemente.
helpField_endOfSupport=Datum, ab dem der Hersteller das Produkt nicht mehr unterstützt.
helpField_endOfSecurity=Datum, ab dem der Hersteller keine Sicherheitsupdates mehr liefert.
helpField_endOfLife=Datum, ab dem das Produkt nicht mehr eingesetzt werden darf.
helpField_isBlacklisted=Das Produkt darf nicht eingesetzt werden; Anwendungen, die es nutzen, werden gemeldet.
helpField_currentMaturity=Heutiger Reifegrad, von 1 (initial) bis 5 (optimiert).
helpField_targetMaturity=Angestrebter Reifegrad, von 1 (initial) bis 5 (optimiert).
helpField_maturityGap=Angestrebter minus aktueller Reifegrad.
helpField_progress=Fertigstellungsgrad in Prozent.
helpField_delayed=Nicht abgeschlossen, obwohl das Enddatum überschritten ist.
helpField_reviewOverdue=Das nächste Reviewdatum ist überschritten.
helpField_nextReviewDate=Datum des nächsten Reviews; danach wird das Element als überfällig gemeldet.
helpField_confidentiality=Schutzbedarf Vertraulichkeit (normal, hoch, sehr hoch).
helpField_integrity=Schutzbedarf Integrität (normal, hoch, sehr hoch).
helpField_availability=Schutzbedarf Verfügbarkeit (normal, hoch, sehr hoch).
helpField_overallLevel=Höchster Wert aus Vertraulichkeit, Integrität und Verfügbarkeit (Maximumprinzip).
helpField_likelihood=Eintrittswahrscheinlichkeit, von 1 (selten) bis 5 (fast sicher).
helpField_impact=Auswirkung bei Eintritt, von 1 (vernachlässigbar) bis 5 (schwerwiegend).
helpField_riskScore=Eintrittswahrscheinlichkeit mal Auswirkung.
helpField_residualLikelihood=Eintrittswahrscheinlichkeit nach der Behandlung (0 = nicht bewertet).
helpField_residualImpact=Auswirkung nach der Behandlung (0 = nicht bewertet).
helpField_treatment=Umgang mit dem Risiko: mindern, akzeptieren, übertragen oder vermeiden.
helpField_effectiveness=Wie gut die Maßnahme wirkt, von 1 (schwach) bis 5 (stark).
helpField_overdue=Nicht umgesetzt, obwohl das Fälligkeitsdatum überschritten ist.
helpField_kpiStatus=Im Plan, gefährdet oder verfehlt – aus dem Istwert im Vergleich zu Ziel- und Schwellenwert.
helpField_direction=Ob höhere oder niedrigere Werte besser sind.
helpField_thresholdValue=Wert, ab dem der KPI als verfehlt gilt.
helpField_dpiaRating=Ergebnis der Datenschutz-Folgenabschätzung (DSGVO Art. 35).
helpField_obligation=Verbindlichkeit der Richtlinie: verpflichtend, empfohlen oder optional.
helpField_effectiveRights=Rechte aus den aktiven Rollen des Benutzers (R = lesen, C = anlegen, U = ändern, D = löschen).
helpField_entitySet=Bereich, für den die Berechtigung gilt; All umfasst alle Bereiche außer Benutzern, Rollen und Berechtigungen.
helpField_validUntil=Letzter Tag, an dem sich der Benutzer anmelden darf; leer bedeutet unbegrenzt.
helpField_active=Inaktive Benutzer können sich nicht anmelden und haben keine Rechte.
helpField_capacity=Anteil einer Vollzeitstelle in Prozent.
helpField_memberFunction=Funktion in der Einheit; eine Einheit hat höchstens eine aktuelle Leitung.
helpField_personnelNumber=Eindeutige Personalnummer.
helpField_filter=OData-Filterausdruck, z. B. status eq 'Active'.
helpField_orderBy=Sortierung, z. B. name asc.
helpField_columns=Als Spalten angezeigte Feldnamen, durch Kommas getrennt.
