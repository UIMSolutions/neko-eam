helpPage_overview_title=Overview
helpPage_overview=<p>The start page summarises the architecture repository: key figures of the application portfolio (operational applications, annual cost, technology risks, capability gaps, TIME deviations, product alerts) and the number of elements per area.</p><ul><li>Select a key figure to open the analysis behind it.</li><li>Select an area to open its list.</li><li><strong>Export</strong> downloads the whole repository as an Excel workbook; <strong>Import</strong> loads such a workbook back (with a check first).</li></ul>
helpPage_list_title=Working with the list
helpPage_list=<ul><li><strong>Search</strong> filters the list by name while you type.</li><li>Select a row to open the element (object page).</li><li><strong>Create</strong> adds a new element.</li><li><strong>Export</strong> downloads the list as CSV (comma or semicolon separated) or as Excel workbook.</li><li><strong>Import</strong> uploads a CSV or Excel file: rows are matched by ID, existing elements are updated, new ones created. <strong>Check</strong> validates the file without saving.</li></ul><p>Buttons you have no permission for are not shown.</p>
helpPage_detail_title=Working with the object page
helpPage_detail=<ul><li><strong>Edit</strong> switches the fields to input; <strong>Save</strong> checks and stores the changes, <strong>Cancel</strong> discards them.</li><li>Fields marked with * are mandatory. Calculated fields (for example hierarchy paths, totals, scores) are filled by the system.</li><li>References are links: select them to open the referenced element.</li><li><strong>Where Used</strong> lists the elements that refer to this one - an element that is still referenced cannot be deleted.</li><li><strong>Comments</strong> keep a journal of the element with date and author. The creator, the last editor and other commenters are notified.</li><li>Hover a field label to see what the field means.</li></ul>
helpPage_analysis_title=Analysis
helpPage_analysis=<ul><li><strong>TIME assessment</strong>: applications by business value and technical fit, with the recommended category (Tolerate, Invest, Migrate, Eliminate) and deviations from the recorded one.</li><li><strong>Technology risks</strong>: applications that use IT components out of support.</li><li><strong>Product lifecycle alerts</strong>: end of support, end of security updates, end of life, expired BSI permissions, blacklisted products in use.</li><li><strong>Capability coverage</strong>: capabilities without (gap) or with several (redundancy) supporting applications.</li></ul>
helpPage_backups_title=Backup and restore
helpPage_backups=<p>A backup contains all data of the tenant, including users, roles, permissions, comments and notifications. Backups are checked (checksum, format, test load) before a restore, and a safety backup of the current state is taken first.</p><ul><li><strong>Create</strong> takes a manual backup; scheduled backups run automatically and only the newest are kept.</li><li>Download a backup to keep it outside the server; upload one to restore it.</li></ul><p>Backup and restore require administrator rights in the tenant.</p>
helpPage_tenants_title=Tenants
helpPage_tenants=<p>Each tenant (Mandant) has its own repository, users, roles and backups. System administrators create, suspend and delete tenants here. A tenant can be mapped to an identity zone (subaccount): users of that zone always work in it.</p><p>Deleting a tenant takes a final backup first.</p>
helpPage_search_title=Search results
helpPage_search=<p>The central search looks through names, descriptions and further text fields of all areas you may read. The best hits come first; select one to open it.</p>
helpPage_report_title=Report results
helpPage_report=<p>A report runs a stored definition (entity set, columns, filter, sort order, grouping) with your permissions. Export the result as CSV, Excel or PDF. A report book runs all of its reports in order.</p>

helpTopicGettingStarted_title=Getting started
helpTopicGettingStarted=<ol><li>Pick an area in the side navigation (for example Applications).</li><li>Open an element from the list, or create a new one.</li><li>Link elements through their reference fields - the analyses and roll-ups build on these links.</li><li>Check the <strong>Overview</strong> and <strong>Analysis</strong> pages for findings.</li></ol>
helpTopicNavigation_title=Navigation
helpTopicNavigation=<ul><li>The side navigation groups the areas; the menu button shows or hides it.</li><li>The logo returns to the overview.</li><li>The user menu (your initials) switches language, theme and tenant, changes your password and signs you out.</li></ul>
helpTopicSearch_title=Search
helpTopicSearch=<p>Type at least two characters in the search field of the shell bar: the best matches of all areas are suggested. Enter shows all results.</p>
helpTopicNotifications_title=Notifications
helpTopicNotifications=<p>The bell shows the number of unread notifications.</p><ul><li><strong>Alerts</strong> are due or overdue items of the areas you may read: product lifecycle dates, document and protection reviews, delayed work packages, overdue security controls and risk treatments, KPIs off track.</li><li><strong>Activity</strong> shows changes, deletions and comments of other users on elements you created, last edited or commented on.</li></ul><p>Select a notification to open the element (it is marked as read); the close button removes it from your list.</p>
helpTopicRights_title=Permissions
helpTopicRights=<p>What you may read, create, change and delete is defined by the roles of your user (Access Management). Areas you may not read are hidden; actions you may not perform are not offered. Ask an administrator if you need more rights.</p>
helpTopicKeyboard_title=Keyboard
helpTopicKeyboard=<ul><li><strong>F1</strong> opens or closes this help.</li><li><strong>Tab</strong> / <strong>Shift+Tab</strong> move between fields and buttons; <strong>Enter</strong> or <strong>Space</strong> activates them.</li><li>In lists, the arrow keys move between rows and <strong>Enter</strong> opens the element.</li></ul>

helpSet_Applications=<p>Applications are the IT systems of the portfolio. They are assessed by business value and technical fit (TIME category), carry lifecycle, criticality and cost, and are linked to capabilities, IT components, products and their owner organisation.</p>
helpSet_ApplicationGroups=<p>Application groups structure the application portfolio as a tree. Product totals are rolled up from the applications of the subtree.</p>
helpSet_Products=<p>Products are software product versions of the product catalogue, with lifecycle dates (end of support, end of security updates, end of life), licensing, approval, security and compliance attributes. Lifecycle dates drive the product alerts.</p>
helpSet_ProductGroups=<p>Product groups structure the product catalogue as a tree.</p>
helpSet_ITComponents=<p>IT components are technical building blocks (platforms, middleware, databases, infrastructure) with vendor, release and end-of-support date. Applications that use components out of support appear as technology risks.</p>
helpSet_BusinessCapabilities=<p>Business capabilities describe what the enterprise does, as a capability map (tree). Applications support capabilities; capabilities without or with several supporting applications appear as gaps or redundancies.</p>
helpSet_BusinessProcesses=<p>Business processes describe how the enterprise works, as a process map (tree) with process owner and manager.</p>
helpSet_BusinessData=<p>Business data are the business objects with owner, version and the rating of the data protection impact assessment (DPIA), linked to capabilities and information flows.</p>
helpSet_Organizations=<p>Organisational units form the organisation chart. Head of unit, members and capacity are calculated from the current members.</p>
helpSet_Enterprises=<p>Organisations are legal entities (group structure) with legal form, register and tax data. Units, members and the managing director are calculated from the organisational units.</p>
helpSet_Members=<p>Members are the people of the organisational units, with function (head, deputy, employee, assistant), employment type, capacity and optionally their user account. A unit has at most one current head; personnel numbers are unique.</p>
helpSet_ServiceProductGroups=<p>Service product groups form the service catalogue (tree) with catalogue type, version and catalogue manager.</p>
helpSet_StrategicGuidelines=<p>Strategic guidelines state the direction of the IT landscape planning (business, architecture, technology, data, security, sourcing, compliance) and apply to capabilities.</p>
helpSet_ServiceCapabilities=<p>Service capabilities describe what IT provides, with current and target maturity (1-5); the maturity gap is calculated.</p>
helpSet_MeasureGroups=<p>Measure groups bundle measures of the landscape planning; the number of measures and their estimated cost are rolled up from the subtree.</p>
helpSet_Measures=<p>Measures are the planned changes of the landscape (introduce, modernise, migrate, consolidate, retire, optimise, invest) with status, progress and cost. They implement guidelines, improve service capabilities and change applications and components.</p>
helpSet_ArchitecturePrinciples=<p>Architecture principles are the fundamental rules of the architecture, with statement, rationale and implications, derived from strategic guidelines.</p>
helpSet_ArchitectureGuidelines=<p>Architecture guidelines make principles concrete (mandatory, recommended, optional), name standard products and apply to IT components.</p>
helpSet_ReferenceArchitectures=<p>Reference architectures describe proven target solutions: principles and guidelines they follow, building blocks, standard products and applications that implement them.</p>
helpSet_ArchitectureDocuments=<p>Architecture documents (concepts, specifications, standards, decisions, policies, ...) with approval and review dates. Documents whose next review date has passed are flagged and notified.</p>
helpSet_Projects=<p>Projects carry out the transformation. Sub projects, work packages, planned effort and progress are rolled up.</p>
helpSet_SubProjects=<p>Sub projects divide a project; work packages, planned effort and progress are rolled up, including nested sub projects.</p>
helpSet_WorkPackages=<p>Work packages are the plannable units of a project with dates, effort, cost and progress. A work package that is not completed by its end date is flagged as delayed and notified.</p>
helpSet_InformationFlows=<p>Information flows connect a source and a target application (API, file, message, database, manual) with data object and frequency. They feed the impact analysis.</p>
helpSet_Users=<p>Users may sign in and act in this tenant. Their rights come from their roles; the effective rights are shown on the object page. With the local sign-in, administrators set passwords here.</p>
helpSet_Roles=<p>Roles bundle permissions. Only active roles grant rights.</p>
helpSet_Permissions=<p>A permission grants read, create, update and delete on one entity set or on all of them (All). Users, roles and permissions themselves are only covered by explicit permissions.</p>
helpSet_ITProcesses=<p>IT processes (for example ITIL or COBIT) with purpose, owner, maturity, steps and KPIs; the KPI status shows the worst KPI.</p>
helpSet_ProcessSteps=<p>Process steps describe the sequence of an IT process (activity, decision, approval, automated, handover) with performer, duration and supporting applications.</p>
helpSet_ProcessKpis=<p>KPIs measure an IT process against target and threshold; status and achievement are calculated. KPIs off track are notified.</p>
helpSet_ProtectionRequirements=<p>Protection requirements (BSI 200-2) rate confidentiality, integrity and availability of an application, business data object or IT component; the overall level follows the maximum principle. Overdue reviews are notified.</p>
helpSet_SecurityRisks=<p>Security risks (ISO 27005) with threat, vulnerability, likelihood and impact; score and level are calculated, also after treatment (residual risk). Open risks past their due date are notified.</p>
helpSet_SecurityControls=<p>Security controls (ISO 27001, BSI IT-Grundschutz, ...) with implementation status and effectiveness; controls not implemented by their due date are notified.</p>
helpSet_Reports=<p>Reports are stored queries: entity set, columns, filter, sort order, grouping and sum. Run them from the object page and export the result.</p>
helpSet_ReportBooks=<p>Report books run several reports in a fixed order for an audience.</p>

helpField_timeCategory=Gartner TIME: Tolerate, Invest, Migrate or Eliminate - the analysis recommends a category from business value and technical fit.
helpField_businessValue=Contribution to the business, from 1 (low) to 5 (high).
helpField_technicalFit=Technical quality and fit to the target architecture, from 1 (poor) to 5 (very good).
helpField_criticality=How critical the application is for the business operation.
helpField_missionCriticality=How critical the element is for the mission of the enterprise.
helpField_levelId=Position in the hierarchy (for example 1, 1.2, 1.2.3).
helpField_hierarchyPath=Path from the top element of the tree to this element.
helpField_objectState=Maintenance state of the entry (draft, active, inactive, archived) - independent of the lifecycle.
helpField_annualCost=Total cost per year (TCO).
helpField_totalUsedProducts=Number of products used, including those of subordinate elements.
helpField_totalAssignedProducts=Number of products assigned, including those of subordinate elements.
helpField_endOfSupport=Date from which the vendor no longer supports the product.
helpField_endOfSecurity=Date from which the vendor no longer provides security updates.
helpField_endOfLife=Date from which the product must no longer be used.
helpField_isBlacklisted=The product must not be used; applications using it are alerted.
helpField_currentMaturity=Maturity today, from 1 (initial) to 5 (optimised).
helpField_targetMaturity=Maturity aimed for, from 1 (initial) to 5 (optimised).
helpField_maturityGap=Target maturity minus current maturity.
helpField_progress=Degree of completion in percent.
helpField_delayed=Not completed although the end date has passed.
helpField_reviewOverdue=The next review date has passed.
helpField_nextReviewDate=Date of the next review; afterwards the element is notified as overdue.
helpField_confidentiality=Protection requirement for confidentiality (normal, high, very high).
helpField_integrity=Protection requirement for integrity (normal, high, very high).
helpField_availability=Protection requirement for availability (normal, high, very high).
helpField_overallLevel=Highest of confidentiality, integrity and availability (maximum principle).
helpField_likelihood=Likelihood of occurrence, from 1 (rare) to 5 (almost certain).
helpField_impact=Impact if the risk occurs, from 1 (negligible) to 5 (severe).
helpField_riskScore=Likelihood multiplied by impact.
helpField_residualLikelihood=Likelihood after the treatment (0 = not assessed).
helpField_residualImpact=Impact after the treatment (0 = not assessed).
helpField_treatment=How the risk is handled: mitigate, accept, transfer or avoid.
helpField_effectiveness=How well the control works, from 1 (weak) to 5 (strong).
helpField_overdue=Not implemented although the due date has passed.
helpField_kpiStatus=On track, at risk or off track, from the actual value compared with target and threshold.
helpField_direction=Whether higher or lower values are better.
helpField_thresholdValue=Value from which the KPI is off track.
helpField_dpiaRating=Result of the data protection impact assessment (GDPR Art. 35).
helpField_obligation=How binding the guideline is: mandatory, recommended or optional.
helpField_effectiveRights=Rights resulting from the active roles of the user (R = read, C = create, U = update, D = delete).
helpField_entitySet=Area the permission applies to; All covers every area except users, roles and permissions.
helpField_validUntil=Last day the user may sign in; empty means without limit.
helpField_active=Inactive users cannot sign in and have no rights.
helpField_capacity=Share of a full-time position in percent.
